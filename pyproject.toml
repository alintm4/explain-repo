[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "explain-repo"
version = "0.1.0"
description = "Static-analysis guided onboarding reports for Python repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "explain-repo contributors" }]
dependencies = [
    "click>=8.1",
    "networkx>=3.2",
    "rich>=13.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
explain-repo = "explain_repo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/explain_repo"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0"]